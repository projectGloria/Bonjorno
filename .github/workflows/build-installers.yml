name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Extension Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Package .zip archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p installers
          (cd dist && zip -r -q "../installers/bonjorno-${VERSION}-all-any.zip" .)

      - name: Package signed .crx installer
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [[ -z "${CRX_PRIVATE_KEY}" ]]; then
            echo "::warning::CRX_PRIVATE_KEY secret is not set; skipping signed .crx package."
            exit 0
          fi

          KEY_FILE="$(mktemp)"
          trap 'rm -f "${KEY_FILE}"' EXIT
          chmod 600 "${KEY_FILE}"
          printf '%s\n' "${CRX_PRIVATE_KEY}" > "${KEY_FILE}"

          google-chrome --no-sandbox \
            --pack-extension="${PWD}/dist" \
            --pack-extension-key="${KEY_FILE}"

          mv "${PWD}/dist.crx" "installers/bonjorno-${VERSION}-all-any.crx"

      - name: List collected installers
        shell: bash
        run: ls -lh installers/

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          fail_on_unmatched_files: true
          generate_release_notes: true
